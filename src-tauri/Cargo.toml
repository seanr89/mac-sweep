[package]
name = "mac-sweep"
version = "0.1.0"
description = "Native macOS disk space analyzer and safe cleanup desktop application"
edition = "2021"

[lib]
name = "mac_sweep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
jwalk = "0.8"
slotmap = "1.0"
dashmap = "6.1"
libc = "0.2"
trash = "5.2"
thiserror = "2.0"
parking_lot = "0.12"
dirs = "6.0"

[dev-dependencies]
tempfile = "3"
